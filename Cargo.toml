[workspace]
members = [
    "crates/viewport-core",
    "crates/viewport-input",
    "crates/viewport-app",
    "src-tauri",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
ironrdp-pdu = "0.11.0"
ironrdp-connector = "0.12.0"
ironrdp-session = "0.13.0"
ironrdp-tokio = "0.12.0"
ironrdp-async = "0.12.0"
ironrdp-graphics = "0.11.0"
ironrdp-core = "0.3.1"
ironrdp-dvc = "0.10.0"
ironrdp-svc = "0.10.0"
ironrdp-displaycontrol = "0.10.0"
ironrdp-rdpeai = "0.2.0"
ironrdp-rdpsnd = "0.11.0"
ironrdp-rdpsnd-native = { version = "0.8.0", default-features = false, features = ["capture"] }
ironrdp-rdpecam = "0.2.0"
ironrdp-tls = { version = "0.3.0", features = ["rustls"] }
cc = "1.1"
eframe = { version = "0.31.0", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.31.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
bytes = "1.9"
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
